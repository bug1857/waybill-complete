[project]
name = "waybill"
version = "0.1.0"
description = "Courier route optimization engine — exact and heuristic solvers with measured optimality gaps"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: deselect with -m 'not slow'",
  "integration: needs a live OSRM server (make osrm-up)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "bench*", "adapters*", "tools*", "api*"]
